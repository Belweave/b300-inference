name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # System python3: some tests run children with PATH=/usr/bin:/bin.
      - run: sudo python3 -m pip install --break-system-packages 'aiohttp>=3.12,<4'
      - run: ./scripts/lint.sh
      - run: python3 -m unittest discover -s tests
      - run: make dry-run
